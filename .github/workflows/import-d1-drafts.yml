name: Import Wikidata D1 drafts (manual, review required)

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Sorgente e tipo di domande'
        required: true
        type: choice
        options:
          - capitals
          - currencies
          - elements
          - symbols
      limit:
        description: 'Numero massimo di domande (tutte draft)'
        required: true
        type: choice
        options:
          - '10'
          - '25'
          - '50'
      confirm:
        description: 'Scrivi IMPORT_DRAFTS per autorizzare SOLO bozze non pubblicate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  import-drafts:
    if: ${{ inputs.confirm == 'IMPORT_DRAFTS' }}
    runs-on: ubuntu-latest
    environment: Environments
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Confirm remote D1 schema before writes
        run: node scripts/verify-cloudflare-d1.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Generate Italian draft-only SQL
        env:
          DATASET: ${{ inputs.dataset }}
          LIMIT: ${{ inputs.limit }}
          QUIZARIO_USER_AGENT: 'QuizarioQuestionBank/0.3 (https://github.com/apirovanosieltre/Quizario; contact: https://github.com/apirovanosieltre/Quizario/issues)'
        run: node scripts/import-open-questions.mjs --dataset="$DATASET" --limit="$LIMIT" --output=imports/generated/manual.sql
      - name: Upload exact generated SQL for audit
        uses: actions/upload-artifact@v4
        with:
          name: quizario-d1-draft-import
          path: imports/generated/manual.sql
          retention-days: 14
      - name: Import only as drafts into quizario-db
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute quizario-db --remote --file=imports/generated/manual.sql --yes
