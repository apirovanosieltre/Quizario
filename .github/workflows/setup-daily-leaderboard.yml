name: Setup daily leaderboard consent in D1
on:
  push:
    branches: [main]
    paths:
      - 'migrations/0004_daily_leaderboard.sql'
      - '.github/workflows/setup-daily-leaderboard.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Scrivi ATTIVA_CLASSIFICA per eseguire la migrazione idempotente su D1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quizario-daily-leaderboard-schema
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'push' || inputs.confirm == 'ATTIVA_CLASSIFICA'
    runs-on: ubuntu-latest
    environment: Environments
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Verify existing D1 schema read-only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-cloudflare-d1.mjs
      - name: Test idempotency, consent opt-out and account cascade
        run: python tests/leaderboard-migration.test.py
      - name: Apply additive opt-in table only (remote D1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute quizario-db --remote --file=migrations/0004_daily_leaderboard.sql --yes
      - name: Verify consent table in remote D1 (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-leaderboard-d1.mjs
