name: Repair missing D1 triggers (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Scrivi RIPARA_TRIGGER per creare SOLO i due trigger mancanti su quizario-db'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quizario-d1-schema-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ inputs.confirm == 'RIPARA_TRIGGER' }}
    runs-on: ubuntu-latest
    environment: Environments
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Restore question publication validation
        run: npx wrangler d1 execute DB --remote --file=repairs/d1/01_publish_validation.sql --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Restore published option-update lock
        run: npx wrangler d1 execute DB --remote --file=repairs/d1/02_options_update_lock.sql --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify all tables, indexes, and triggers
        run: node scripts/verify-cloudflare-d1.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}