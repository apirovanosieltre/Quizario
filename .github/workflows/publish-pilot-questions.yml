name: Publish first 30 Quizario questions (one-off pilot)

on:
  push:
    branches: [main]
    paths:
      - 'seeds/pilot-questions.json'
      - 'scripts/prepare-pilot.mjs'
      - '.github/workflows/publish-pilot-questions.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Scrivi PUBBLICA_30 per ripetere il controllo/importazione idempotente'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quizario-once-pilot-questions
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.confirm == 'PUBBLICA_30'
    runs-on: ubuntu-latest
    environment: Environments
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Check live D1 schema (read-only)
        run: node scripts/verify-cloudflare-d1.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Test original questions, option integrity and idempotence offline
        run: python tests/pilot-questions.test.py
      - name: Generate bounded, auditable SQL for the pilot
        run: node scripts/prepare-pilot.mjs --output=imports/pilot-20261112.sql
      - name: Archive exactly the SQL to be executed
        uses: actions/upload-artifact@v4
        with:
          name: quizario-first-30-published-questions
          path: imports/pilot-20261112.sql
          retention-days: 14
      - name: Publish to quizario-db (30 fixed source-checked questions only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute quizario-db --remote --file=imports/pilot-20261112.sql --yes
      - name: Confirm distribution in real D1 database (read-only)
        run: node scripts/verify-pilot-questions.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}