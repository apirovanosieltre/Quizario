name: Import 60 Quizario editorial drafts (never publish)
on:
  push:
    branches: [main]
    paths:
      - 'seeds/editorial-20261113.json'
      - 'scripts/prepare-editorial-drafts.mjs'
      - '.github/workflows/import-editorial-drafts.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Scrivi IMPORTA_60_BOZZE (nessuna pubblicazione)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: quizario-editorial-drafts-60
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'push' || inputs.confirm == 'IMPORTA_60_BOZZE'
    runs-on: ubuntu-latest
    environment: Environments
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Verify live D1 schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-cloudflare-d1.mjs
      - name: Validate drafts, source references and idempotence in SQLite
        run: python tests/editorial-bank.test.py
      - name: Generate SQL (drafts only)
        run: node scripts/prepare-editorial-drafts.mjs --output=imports/editorial-20261113.sql
      - name: Keep exact SQL for editorial audit
        uses: actions/upload-artifact@v4
        with:
          name: quizario-editorial-60-drafts
          path: imports/editorial-20261113.sql
          retention-days: 14
      - name: Import 60 drafts into D1 (do not publish)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute quizario-db --remote --file=imports/editorial-20261113.sql --yes
      - name: Read-only verification of imported draft bank
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-editorial-drafts.mjs
